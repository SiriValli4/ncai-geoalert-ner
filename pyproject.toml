[project]
name = "geoalert-ner"
version = "0.1.0"
description = "Landslide early-warning API for the North Eastern Region of India."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.9",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "geoalchemy2>=0.15",
    "shapely>=2.0",
    "alembic>=1.13",
]

[project.optional-dependencies]
# Landslide risk model (scikit-learn pipeline; xgboost only if trained with --model xgb).
risk = [
    "joblib>=1.3",
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "shap>=0.44",
]
# YOLOv8 hazard photo verification. Heavy (pulls in torch).
vision = [
    "ultralytics>=8.2",
    "opencv-python-headless>=4.9",
    "pillow>=10.0",
    "numpy>=1.24",
]
# Optional: HEIC uploads from iPhones.
heic = ["pillow-heif>=0.16"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.5",
    "mypy>=1.10",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["legacy", "ml/training"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
# FastAPI's Depends()/File()/Query() defaults are the idiomatic pattern.
ignore = ["B008"]

[tool.ruff.lint.isort]
# The local alembic/ migrations dir would otherwise make `alembic` look first-party.
known-third-party = ["alembic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
# numpy's stubs use 3.12 syntax; checking as 3.12 is fine for a >=3.11 codebase.
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
exclude = ["legacy/", "ml/training/", "alembic/"]
